name: China Financial Central Gov Cash Clock V2 Data Test

on:
  workflow_dispatch:
  push:
    branches: [agent/china-financial-data-completeness-v1]
    paths:
      - 'collectors/china_financial/central_gov_bond_cash_clock_v1.py'
      - 'collectors/china_financial/central_gov_bond_cash_clock_v2.py'
      - '.github/workflows/china-financial-central-gov-cash-clock-v2-data-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile V1 and V2
        run: |
          python3 -m py_compile collectors/china_financial/central_gov_bond_cash_clock_v1.py
          python3 -m py_compile collectors/china_financial/central_gov_bond_cash_clock_v2.py

      - name: Pre-issue explicit auction payment maturity
        run: |
          set -euo pipefail
          rm -rf /tmp/cgb-pre
          PYTHONPATH=collectors/china_financial python3 collectors/china_financial/central_gov_bond_cash_clock_v2.py \
            --as-of 2026-07-21 \
            --detail-url 'https://zwgls.mof.gov.cn/ywgg/202607/t20260720_3993865.htm' \
            --publication-date 2026-07-21 \
            --out /tmp/cgb-pre
          python3 - <<'PY'
          import json
          obs=json.load(open('/tmp/cgb-pre/observations.json')); gaps=json.load(open('/tmp/cgb-pre/gaps.json'))
          assert gaps==[],gaps
          def ok(s,d,v): return any(x['series_id']==s and x['reference_date']==d and abs(float(x['value'])-v)<1e-9 for x in obs)
          assert ok('FISC_GOV_BOND_AUCTION_EVENT','2026-07-22',350),obs
          assert ok('FISC_GOV_BOND_PAYMENT_EVENT','2026-07-23',350),obs
          assert ok('FISC_GOV_BOND_MATURITY_EVENT','2026-10-22',350),obs
          print('CENTRAL_V2_PREISSUE_PASS',len(obs))
          PY

      - name: Actual discount Treasury result
        run: |
          set -euo pipefail
          rm -rf /tmp/cgb-result
          PYTHONPATH=collectors/china_financial python3 collectors/china_financial/central_gov_bond_cash_clock_v2.py \
            --as-of 2026-07-22 \
            --detail-url 'https://zwgls.mof.gov.cn/ywgg/202607/t20260722_3994013.htm' \
            --publication-date 2026-07-22 \
            --out /tmp/cgb-result
          python3 - <<'PY'
          import json,sys
          obs=json.load(open('/tmp/cgb-result/observations.json')); gaps=json.load(open('/tmp/cgb-result/gaps.json')); ctx=json.load(open('/tmp/cgb-result/context.json'))
          def ok(s,d,v): return any(x['series_id']==s and x['reference_date']==d and abs(float(x['value'])-v)<1e-9 for x in obs)
          bad=[]
          if gaps: bad.append('gaps')
          if not ok('FISC_GOV_BOND_AUCTION_EVENT','2026-07-22',350): bad.append('actual_auction')
          if not ok('FISC_GOV_BOND_MATURITY_EVENT','2026-10-22',350): bad.append('actual_maturity')
          inferred=[x for x in obs if x['series_id']=='FISC_GOV_BOND_PAYMENT_EVENT' and (x.get('dimensions') or {}).get('payment_date_source')=='DISTRIBUTION_END_DATE']
          if inferred: bad.append('inferred_result_payment_not_filtered')
          if bad:
              print('::error title=Central Treasury V2 result regression::'+json.dumps({'bad':bad,'observations':obs,'gaps':gaps,'context':ctx},ensure_ascii=False)); sys.exit(1)
          print('CENTRAL_V2_RESULT_PASS',len(obs))
          PY

      - name: Coupon schedule and cash estimate
        run: |
          set -euo pipefail
          rm -rf /tmp/cgb-coupon
          PYTHONPATH=collectors/china_financial python3 collectors/china_financial/central_gov_bond_cash_clock_v2.py \
            --as-of 2026-02-24 \
            --detail-url 'https://zwgls.mof.gov.cn/ywgg/202602/t20260224_3983989.htm' \
            --publication-date 2026-02-24 \
            --out /tmp/cgb-coupon
          python3 - <<'PY'
          import json,sys
          obs=json.load(open('/tmp/cgb-coupon/observations.json')); gaps=json.load(open('/tmp/cgb-coupon/gaps.json')); ctx=json.load(open('/tmp/cgb-coupon/context.json'))
          expected=1350*0.0175/2
          s=[x for x in obs if x['series_id']=='FISC_GOV_BOND_COUPON_SCHEDULE_EVENT']
          c=[x for x in obs if x['series_id']=='FISC_GOV_BOND_COUPON_CASH_ESTIMATE']
          bad=[]
          if gaps: bad.append('gaps')
          if not any(x['reference_date']=='2026-08-25' and abs(float(x['value'])-1.75)<1e-9 for x in s): bad.append('coupon_schedule')
          if not any(x['reference_date']=='2026-08-25' and abs(float(x['value'])-expected)<1e-9 for x in c): bad.append('coupon_cash')
          if bad:
              print('::error title=Central Treasury V2 coupon regression::'+json.dumps({'bad':bad,'observations':obs[:30],'gaps':gaps,'context':ctx},ensure_ascii=False)); sys.exit(1)
          required={'series_id','reference_date','value','unit','provider','source_semantic','collected_at','collector_version','source_url','evidence_sha256'}
          assert all(not (required-set(x)) for x in obs)
          print('CENTRAL_V2_COUPON_PASS',len(s),len(c),expected)
          PY
