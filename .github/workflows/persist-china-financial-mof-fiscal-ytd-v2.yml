name: Persist China Financial MOF Fiscal YTD V2

on:
  push:
    branches: [v1.9-public-foundation]
    paths:
      - '.github/workflows/persist-china-financial-mof-fiscal-ytd-v2.yml'
  workflow_dispatch:
    inputs:
      year:
        description: Calendar year
        required: true
        default: '2026'

permissions:
  contents: write

jobs:
  persist-mof-fiscal-ytd-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=20 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
      - name: Run MOF fiscal collector
        env:
          INPUT_YEAR: ${{ inputs.year }}
        run: |
          YEAR="${INPUT_YEAR:-2026}"
          echo "TARGET_YEAR=${YEAR}" >> "$GITHUB_ENV"
          python3 collectors/china_financial/mof_fiscal_ytd_family_v2.py --year "${YEAR}" --out out/mof_fiscal_ytd_v2
      - name: Prepare normalized dataset
        run: |
          set -euo pipefail
          mkdir -p "data/china_financial/observations/${TARGET_YEAR}" "data/china_financial/derived/${TARGET_YEAR}" "data/china_financial/gaps/${TARGET_YEAR}" "data/china_financial/runs/${TARGET_YEAR}"
          cp out/mof_fiscal_ytd_v2/observations.json "data/china_financial/observations/${TARGET_YEAR}/${TARGET_YEAR}-mof-fiscal-ytd-v2.json"
          cp out/mof_fiscal_ytd_v2/derived.json "data/china_financial/derived/${TARGET_YEAR}/${TARGET_YEAR}-mof-fiscal-ytd-v2.json"
          cp out/mof_fiscal_ytd_v2/gaps.json "data/china_financial/gaps/${TARGET_YEAR}/${TARGET_YEAR}-mof-fiscal-ytd-v2.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          year=os.environ['TARGET_YEAR']
          run=json.loads(Path('out/mof_fiscal_ytd_v2/run.json').read_text(encoding='utf-8'))
          run.update(github_repository=os.environ['GITHUB_REPOSITORY'],github_run_id=os.environ['GITHUB_RUN_ID'],github_source_commit=os.environ['GITHUB_SHA'],persistence='NORMALIZED_PUBLIC_DATA_ONLY_RAW_EVIDENCE_NOT_COMMITTED',persistence_workflow_version='V1_REBASE_BEFORE_PUSH')
          Path(f'data/china_financial/runs/{year}/{year}-mof-fiscal-ytd-v2.json').write_text(json.dumps(run,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit rebase and push
        run: |
          set -euo pipefail
          git config user.name "market-data-collector[bot]"
          git config user.email "market-data-collector[bot]@users.noreply.github.com"
          git add data/china_financial
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(china-financial): persist MOF fiscal YTD ${TARGET_YEAR}"
          git fetch --depth=20 origin "${GITHUB_REF_NAME}"
          git rebase FETCH_HEAD
          git push origin HEAD:"${GITHUB_REF_NAME}"
