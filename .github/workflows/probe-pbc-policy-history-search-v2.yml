name: Probe PBC Policy History Search V2
on:
  workflow_dispatch:
  push:
    branches: [agent/china-financial-data-completeness-v1]
    paths:
      - 'tests/probes/probe_pbc_policy_history_search_v2.py'
      - '.github/workflows/probe-pbc-policy-history-search-v2.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe official PBC history paths
        run: python3 tests/probes/probe_pbc_policy_history_search_v2.py
