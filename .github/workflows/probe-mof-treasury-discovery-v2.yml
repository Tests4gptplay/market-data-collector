name: Probe MOF Treasury Discovery V2
on:
  workflow_dispatch:
  push:
    branches: [agent/china-financial-data-completeness-v1]
    paths:
      - 'tests/probes/probe_mof_treasury_discovery_v2.py'
      - '.github/workflows/probe-mof-treasury-discovery-v2.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/probes/probe_mof_treasury_discovery_v2.py
