name: Probe Pledged Repo Daily Bulletin Exact

on:
  push:
    branches: [v1.9-public-foundation]
    paths:
      - 'tests/probes/probe_pr_dly_bltn_exact.py'
      - '.github/workflows/probe-pr-dly-bltn-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout without third-party action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Probe exact daily bulletin historical route
        run: python3 tests/probes/probe_pr_dly_bltn_exact.py
