name: China Financial Daily Candidate Integration Gate

# Contract-declared candidate entry point. This is an end-to-end measurement /
# readiness gate, not a declaration of production stability and not yet a
# scheduled runtime-Store writer.
on:
  workflow_dispatch:
    inputs:
      market_date:
        description: Optional exact market date YYYY-MM-DD; blank = auto-resolve latest eligible date
        required: false
      as_of:
        description: Optional policy/fiscal context as-of date YYYY-MM-DD; blank = current Asia/Shanghai date
        required: false
      year:
        description: Optional calendar year for monthly release families; blank = year(as_of)
        required: false
  push:
    branches:
      - agent/china-financial-data-completeness-v1
      - v1.9-public-foundation
    paths:
      - 'collectors/china_financial/**'
      - 'contracts/china_financial/**'
      - 'registry/china_financial/**'
      - 'tests/china_financial_measurement_readiness_v1.py'
      - '.github/workflows/china-financial-daily.yml'
      - '.github/workflows/china-financial-local-gov-cash-clock-v3-data-test.yml'

permissions:
  contents: read

jobs:
  measurement-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INPUT_MARKET_DATE: ${{ github.event.inputs.market_date || '' }}
      INPUT_AS_OF: ${{ github.event.inputs.as_of || '' }}
      INPUT_YEAR: ${{ github.event.inputs.year || '' }}
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install PDF parser
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0'

      - name: Resolve dynamic context dates
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_AS_OF}" ]; then
            AS_OF="${INPUT_AS_OF}"
          else
            AS_OF="$(TZ=Asia/Shanghai date +%F)"
          fi
          if [ -n "${INPUT_YEAR}" ]; then
            YEAR="${INPUT_YEAR}"
          else
            YEAR="${AS_OF%%-*}"
          fi
          SINCE_DATE="$(python3 - "${AS_OF}" <<'PY'
          import sys
          from datetime import date,timedelta
          print((date.fromisoformat(sys.argv[1])-timedelta(days=10)).isoformat())
          PY
          )"
          echo "AS_OF=${AS_OF}" >> "$GITHUB_ENV"
          echo "YEAR=${YEAR}" >> "$GITHUB_ENV"
          echo "SINCE_DATE=${SINCE_DATE}" >> "$GITHUB_ENV"
          printf 'AS_OF=%s YEAR=%s SINCE_DATE=%s\n' "$AS_OF" "$YEAR" "$SINCE_DATE"

      - name: Compile active candidate collectors
        run: |
          set -euo pipefail
          python3 -m py_compile \
            collectors/china_financial/market_family_v4.py \
            collectors/china_financial/pbc_monthly_credit_family_v1.py \
            collectors/china_financial/mof_fiscal_ytd_family_v2.py \
            collectors/china_financial/pbc_monthly_policy_tools_v2.py \
            collectors/china_financial/policy_event_family_v6_incremental.py \
            collectors/china_financial/rrr_event_family_v5_incremental.py \
            collectors/china_financial/nafmii_dfi_issuance_family_v1.py \
            collectors/china_financial/local_gov_bond_cash_clock_v1.py \
            collectors/china_financial/local_gov_bond_cash_clock_v3.py \
            tests/china_financial_measurement_readiness_v1.py

      - name: Offline persisted-data and capability gate
        run: |
          set -euo pipefail
          python3 tests/china_financial_measurement_readiness_v1.py --out /tmp/china-financial-readiness.json
          cat /tmp/china-financial-readiness.json

      - name: Resolve and run live fast market family
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_MARKET_DATE}" ]; then
            CANDIDATES="${INPUT_MARKET_DATE}"
          else
            CANDIDATES="$(python3 - "${AS_OF}" <<'PY'
          import sys
          from datetime import date,timedelta
          d=date.fromisoformat(sys.argv[1])
          print(' '.join((d-timedelta(days=i)).isoformat() for i in range(8)))
          PY
          )"
          fi

          MARKET_DATE=""
          for D in ${CANDIDATES}; do
            rm -rf /tmp/market-v4
            set +e
            python3 collectors/china_financial/market_family_v4.py --date "${D}" --out /tmp/market-v4
            RC=$?
            set -e
            if [ "${RC}" -eq 0 ]; then
              MARKET_DATE="${D}"
              break
            fi
            if [ -n "${INPUT_MARKET_DATE}" ]; then
              exit "${RC}"
            fi
          done
          if [ -z "${MARKET_DATE}" ]; then
            echo 'No eligible market date passed within the 8-day auto-resolution window.' >&2
            exit 2
          fi
          echo "MARKET_DATE=${MARKET_DATE}" >> "$GITHUB_ENV"
          cat "/tmp/market-v4/${MARKET_DATE}/run.json"
          printf 'Resolved MARKET_DATE=%s\n' "$MARKET_DATE"

      - name: Live monthly credit family
        run: |
          set -euo pipefail
          rm -rf /tmp/monthly-credit
          python3 collectors/china_financial/pbc_monthly_credit_family_v1.py --year "${YEAR}" --out /tmp/monthly-credit
          cat /tmp/monthly-credit/run.json

      - name: Live MOF fiscal family
        run: |
          set -euo pipefail
          rm -rf /tmp/mof-fiscal
          python3 collectors/china_financial/mof_fiscal_ytd_family_v2.py --year "${YEAR}" --out /tmp/mof-fiscal
          cat /tmp/mof-fiscal/run.json

      - name: Live monthly policy tools
        run: |
          set -euo pipefail
          rm -rf /tmp/policy-tools
          python3 collectors/china_financial/pbc_monthly_policy_tools_v2.py --year "${YEAR}" --out /tmp/policy-tools
          cat /tmp/policy-tools/run.json

      - name: Live NAFMII primary issuance
        run: |
          set -euo pipefail
          rm -rf /tmp/nafmii
          python3 collectors/china_financial/nafmii_dfi_issuance_family_v1.py --year "${YEAR}" --out /tmp/nafmii
          cat /tmp/nafmii/run.json

      - name: Live policy incremental state checks
        run: |
          set -euo pipefail
          rm -rf /tmp/rrr-inc /tmp/omo-inc
          PYTHONPATH=. python3 collectors/china_financial/rrr_event_family_v5_incremental.py \
            --date "${AS_OF}" --since-date "${SINCE_DATE}" --out /tmp/rrr-inc
          # No hard-coded previous policy rate is supplied here. The incremental
          # checker reports current recent-state metadata without inventing a
          # Store state. A runtime Store writer may supply previous state later.
          PYTHONPATH=. python3 collectors/china_financial/policy_event_family_v6_incremental.py \
            --date "${MARKET_DATE}" --since-date "${SINCE_DATE}" --out /tmp/omo-inc
          cat /tmp/rrr-inc/run.json
          cat /tmp/omo-inc/run.json

      - name: Live simplified local-government cash clock
        run: |
          set -euo pipefail
          rm -rf /tmp/cash-clock-v3
          PYTHONPATH=. python3 collectors/china_financial/local_gov_bond_cash_clock_v3.py \
            --as-of "${AS_OF}" --lookback-days 2 --out /tmp/cash-clock-v3
          cat /tmp/cash-clock-v3/context.json
          cat /tmp/cash-clock-v3/run.json

      - name: Final semantics summary
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/china-financial-readiness.json'))
          cash=json.load(open('/tmp/cash-clock-v3/context.json'))
          summary={
            'as_of': os.environ['AS_OF'],
            'resolved_market_date': os.environ['MARKET_DATE'],
            'measurement_readiness': r['status'],
            'production_status': r['production_status'],
            'cash_clock_status': cash['status'],
            'cash_clock_scope': cash['scope'],
            'central_government_cash_clock_included': cash['central_government_bonds_included'],
            'warning': 'A green measurement gate is not a PRODUCTION release declaration.'
          }
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          assert r['status']=='MODEL_CONTEXT_MEASURABLE',r
          assert cash['window_proof']['all_publication_days_checked'] is True,cash
          PY
