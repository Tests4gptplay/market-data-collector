name: China Financial PBC Monthly Policy Tools V2 Candidate

on:
  push:
    branches: [v1.9-public-foundation]
    paths:
      - 'collectors/china_financial/pbc_monthly_policy_tools_v2.py'
      - '.github/workflows/china-financial-pbc-monthly-policy-tools-v2-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Run V2
        run: python3 collectors/china_financial/pbc_monthly_policy_tools_v2.py --year 2026 --out out/pbc_monthly_policy_tools_v2
      - name: Show summary
        run: |
          cat out/pbc_monthly_policy_tools_v2/run.json
          cat out/pbc_monthly_policy_tools_v2/gaps.json
