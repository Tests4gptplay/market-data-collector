name: Probe PBC OMO Pagination V2
on:
  workflow_dispatch:
  push:
    branches: [agent/china-financial-data-completeness-v1]
    paths:
      - 'tests/probes/probe_pbc_omo_pagination_v2.py'
      - '.github/workflows/probe-pbc-omo-pagination-v2.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/probes/probe_pbc_omo_pagination_v2.py
