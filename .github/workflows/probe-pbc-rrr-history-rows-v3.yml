name: Probe PBC RRR History Rows V3
on:
  workflow_dispatch:
  push:
    branches: [agent/china-financial-data-completeness-v1]
    paths:
      - 'tests/probes/probe_pbc_rrr_history_rows_v3.py'
      - '.github/workflows/probe-pbc-rrr-history-rows-v3.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/probes/probe_pbc_rrr_history_rows_v3.py
