name: Persist China Financial Policy Event V1 Seed

on:
  push:
    branches: [v1.9-public-foundation]
    paths:
      - '.github/workflows/persist-china-financial-policy-event-v1-seed.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: Operation/reference date YYYY-MM-DD
        required: true
        default: '2026-08-14'

permissions:
  contents: write

jobs:
  persist-policy-event-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch without third-party action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
      - name: Run policy event V1 collector
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          TARGET_DATE="${INPUT_TARGET_DATE:-2026-08-14}"
          echo "TARGET_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"
          python3 collectors/china_financial/policy_event_family_v1.py \
            --date "${TARGET_DATE}" \
            --out out/china_financial_policy_event_v1
      - name: Prepare normalized public dataset
        run: |
          set -euo pipefail
          YEAR="${TARGET_DATE:0:4}"
          mkdir -p "data/china_financial/observations/${YEAR}" \
                   "data/china_financial/gaps/${YEAR}" \
                   "data/china_financial/runs/${YEAR}"
          cp out/china_financial_policy_event_v1/observations.json \
            "data/china_financial/observations/${YEAR}/${TARGET_DATE}-policy-event-v1.json"
          cp out/china_financial_policy_event_v1/gaps.json \
            "data/china_financial/gaps/${YEAR}/${TARGET_DATE}-policy-event-v1.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET_DATE']; year=target[:4]
          p=Path('out/china_financial_policy_event_v1/run.json')
          run=json.loads(p.read_text(encoding='utf-8'))
          run['github_repository']=os.environ['GITHUB_REPOSITORY']
          run['github_run_id']=os.environ['GITHUB_RUN_ID']
          run['github_source_commit']=os.environ['GITHUB_SHA']
          run['persistence']='NORMALIZED_PUBLIC_DATA_ONLY_RAW_EVIDENCE_NOT_COMMITTED'
          Path(f'data/china_financial/runs/{year}/{target}-policy-event-v1.json').write_text(
              json.dumps(run,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit normalized dataset back to branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "market-data-collector[bot]"
          git config user.email "market-data-collector[bot]@users.noreply.github.com"
          git add data/china_financial
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data(china-financial): persist policy events ${TARGET_DATE}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
