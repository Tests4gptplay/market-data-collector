name: Hourly official npm download statistics

on:
  schedule:
    # Five opportunities per hour; later runs skip if this UTC hour already has a usable snapshot.
    - cron: '7,12,17,22,27 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/npm-downloads-hourly.yml'
      - 'collectors/npm_downloads/collect_npm.py'
      - 'tests/npm_downloads/test_collector.py'

permissions:
  contents: write

concurrency:
  group: npm-downloads-hourly
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public market-data-collector
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip duplicate scheduled snapshot within the same UTC hour
        id: sampling
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          collect = True
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule':
              path = Path('data/npm_downloads/latest.json')
              if path.is_file():
                  try:
                      snapshot = json.loads(path.read_text(encoding='utf-8'))
                      previous = datetime.fromisoformat(snapshot['sampled_at_utc'])
                      current = datetime.now(timezone.utc)
                      usable = any(
                          p.get('last_week', {}).get('status') == 'ok'
                          for p in snapshot.get('packages', {}).values()
                      )
                      if previous.tzinfo and usable and (
                          previous.astimezone(timezone.utc).strftime('%Y-%m-%dT%H')
                          == current.strftime('%Y-%m-%dT%H')
                      ):
                          collect = False
                  except (ValueError, KeyError, TypeError):
                      pass

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'collect={str(collect).lower()}\n')
          print('Collect new npm snapshot' if collect else 'UTC hour already sampled; skip duplicate')
          PY
      - name: Test collector parsing and publication checks
        if: steps.sampling.outputs.collect == 'true'
        run: python3 -m unittest discover -s tests/npm_downloads -v
      - name: Collect official npm downloads for six DSH plugin projects
        if: steps.sampling.outputs.collect == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 collectors/npm_downloads/collect_npm.py
      - name: Persist npm statistics in this public repository
        if: steps.sampling.outputs.collect == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/npm_downloads/latest.json data/npm_downloads/history/
          if ! git diff --cached --quiet; then
            git commit -m 'data: record official npm download snapshot'
            git push
          fi
      - name: Verify at least one genuine official npm response
        if: steps.sampling.outputs.collect == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          snapshot=json.loads(Path('data/npm_downloads/latest.json').read_text(encoding='utf-8'))
          valid=[name for name,p in snapshot['packages'].items()
                 if p.get('last_week',{}).get('status')=='ok']
          print('Confirmed official npm weekly counts:', len(valid), '/', len(snapshot['packages']))
          if not valid:
              raise SystemExit('No valid npm weekly download response; inspect the persisted failure statuses')
          PY
