name: tmp-zhihu-fetch
on:
  push:
    branches: [tmp-zhihu-fetch-20260827]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Fetch Zhihu articles
        run: python tmp_zhihu_fetch.py | tee zhihu_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: zhihu-result
          path: zhihu_result.json
          retention-days: 1
