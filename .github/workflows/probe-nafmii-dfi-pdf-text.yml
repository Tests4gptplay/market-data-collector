name: Probe NAFMII DFI PDF Text

on:
  push:
    branches: [v1.9-public-foundation]
    paths:
      - 'tests/probes/probe_nafmii_dfi_pdf_text.py'
      - '.github/workflows/probe-nafmii-dfi-pdf-text.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without third-party action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Probe PDF text extraction
        run: python3 tests/probes/probe_nafmii_dfi_pdf_text.py
