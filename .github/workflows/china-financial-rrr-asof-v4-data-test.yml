name: China Financial RRR As-Of V4 Data Test
on:
  workflow_dispatch:
  push:
    branches: [agent/china-financial-data-completeness-v1]
    paths:
      - 'collectors/china_financial/rrr_event_family_v4.py'
      - '.github/workflows/china-financial-rrr-asof-v4-data-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate direct-event root and carry-forward
        run: |
          set -e
          for d in 2025-05-07 2026-08-16; do
            rm -rf "/tmp/rrr4-$d"
            PYTHONPATH=. python3 collectors/china_financial/rrr_event_family_v4.py --date "$d" --out "/tmp/rrr4-$d"
            python3 - "$d" "/tmp/rrr4-$d" <<'PY'
          import json,sys
          d,p=sys.argv[1:]
          obs=json.load(open(p+'/observations.json')); run=json.load(open(p+'/run.json'))
          rows=[x for x in obs if x.get('series_id')=='POL_RRR_CHANGE_BPS']
          assert len(rows)==1,(d,rows,run)
          r=rows[0]
          assert r['reference_date']=='2025-05-07',(d,r)
          assert abs(float(r['value'])+50.0)<1e-9,(d,r)
          assert r['dimensions']['historical_review_articles_excluded_from_root'] is True
          assert r['dimensions']['as_of_target_date']==d
          assert '货币政策大事记' not in r.get('dimensions',{}).get('matched_text','')
          print(json.dumps({'date':d,'reference_date':r['reference_date'],'bps':r['value'],'effective_date':r['dimensions'].get('effective_date'),'pages':run['pages_scanned_after_localization']},ensure_ascii=False))
          PY
          done
