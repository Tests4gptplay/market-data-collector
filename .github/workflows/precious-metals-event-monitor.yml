name: One-time precious-metals event monitor

on:
  workflow_dispatch:
    inputs:
      runtime_seconds:
        description: "Runtime in seconds (default 300)"
        required: false
        default: "300"
  schedule:
    # 2026-08-28 22:58 Asia/Tokyo = 2026-08-28 13:58 UTC.
    # GitHub schedules are minute-granularity and may start late.
    - cron: "58 13 28 8 *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Enforce one-time scheduled date
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%F)" != "2026-08-28" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled date gate closed."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Stream five-minute monitor
        if: steps.gate.outputs.run == 'true'
        env:
          RUNTIME: ${{ github.event.inputs.runtime_seconds || '300' }}
        run: |
          python collectors/precious_metals_event_monitor.py             --runtime-seconds "$RUNTIME"             --market-interval 5             --news-interval 1 --aux-news-interval 20             --output-dir output/precious-metals-event

      - name: Upload structured snapshots and events
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: precious-metals-event-${{ github.run_id }}
          path: output/precious-metals-event/
          if-no-files-found: warn
          retention-days: 7
